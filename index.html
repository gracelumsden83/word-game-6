<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Ladder Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">
        <h1>Word Ladder</h1>

        <p class="instructions">
            Find the hidden word using the letters below.
            Each new word keeps the letters from the word before it!
        </p>

        <div id="level">
            Level 1
        </div>

        <div id="word-boxes"></div>

        <div id="letter-bank"></div>

        <button id="clear-button">Clear</button>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
